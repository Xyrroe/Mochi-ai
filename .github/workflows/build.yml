name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: MochiAI
      - run: cp MochiAI/app/build/outputs/apk/debug/app-debug.apk Mochi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-apk
          path: Mochi.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mochi (build terbaru)
          files: Mochi.apk
